name: release

# Publishes the release tree that release-prep already committed to main.
# Nothing is rebuilt here: the FFI builds are not reproducible, so a rebuild
# would attach binaries that differ from the ones `go get` users receive
# from the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version with a leading v, for example v0.0.9"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      # Defaults to github.sha, the commit this run was dispatched on, so a
      # merge to main mid-run cannot change what gets validated and tagged.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]

      - name: Verify committed release tree
        shell: bash
        run: |
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          echo "PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"

          current_version="$(sed -n -E '0,/^version = "([^"]+)"/s//\1/p' Cargo.toml)"
          if [ "$current_version" != "${VERSION#v}" ]; then
            echo "Cargo.toml version is $current_version, expected ${VERSION#v} on main." >&2
            echo "Run release-prep.yml for $VERSION, merge that PR, and retry release.yml." >&2
            exit 1
          fi

          # Checksums cover Cargo.lock and the header as well as the libraries,
          # so this also fails if anything changed them after release-prep
          # (for example an upstream pin bump merged after the release-prep PR).
          for f in \
            Cargo.lock \
            internal/ffi/include/monty_go_ffi.h \
            internal/ffi/lib/darwin_arm64/libmonty_go_ffi.dylib \
            internal/ffi/lib/linux_amd64/libmonty_go_ffi.so \
            internal/ffi/lib/linux_arm64/libmonty_go_ffi.so \
            internal/ffi/lib/linux_amd64_musl/libmonty_go_ffi.so \
            internal/ffi/lib/linux_arm64_musl/libmonty_go_ffi.so \
            internal/ffi/lib/windows_amd64/monty_go_ffi.dll; do
            grep -q "  $f\$" internal/ffi/checksums.txt || { echo "checksums.txt does not cover $f" >&2; exit 1; }
          done
          if ! sha256sum --check --strict internal/ffi/checksums.txt; then
            echo "The committed release tree does not match internal/ffi/checksums.txt." >&2
            echo "Re-run release-prep.yml for $VERSION from current main." >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: Validate committed release tree
        shell: bash
        run: |
          CGO_ENABLED=0 go test ./...
          go vet ./...
          (
            cd examples
            CGO_ENABLED=0 go run ./cmd/example
          )

      - name: Tag and push
        shell: bash
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        shell: bash
        run: |
          notes_file="$(mktemp)"

          {
            echo "## Changes"
            echo
            if [ -n "${PREVIOUS_TAG:-}" ]; then
              echo "Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${VERSION}"
              echo
              git log --reverse --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              echo "Initial release."
              echo
              git log --reverse --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "${GITHUB_SHA}"
            fi
          } > "$notes_file"

          # GitHub release assets must have unique filenames within a release,
          # but several platforms share the basename libmonty_go_ffi.so/.dylib.
          mkdir -p .release-assets
          cp internal/ffi/lib/darwin_arm64/libmonty_go_ffi.dylib .release-assets/libmonty_go_ffi-darwin_arm64.dylib
          cp internal/ffi/lib/linux_amd64/libmonty_go_ffi.so .release-assets/libmonty_go_ffi-linux_amd64.so
          cp internal/ffi/lib/linux_amd64_musl/libmonty_go_ffi.so .release-assets/libmonty_go_ffi-linux_amd64_musl.so
          cp internal/ffi/lib/linux_arm64/libmonty_go_ffi.so .release-assets/libmonty_go_ffi-linux_arm64.so
          cp internal/ffi/lib/linux_arm64_musl/libmonty_go_ffi.so .release-assets/libmonty_go_ffi-linux_arm64_musl.so
          cp internal/ffi/lib/windows_amd64/monty_go_ffi.dll .release-assets/monty_go_ffi-windows_amd64.dll
          cp internal/ffi/checksums.txt .release-assets/checksums.txt

          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$notes_file" \
            .release-assets/*

      - name: Warm the Go module proxy
        shell: bash
        run: |
          GOPROXY=https://proxy.golang.org go list -m "github.com/${GITHUB_REPOSITORY}@$VERSION"
