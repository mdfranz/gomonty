name: zizmor

# Lints the workflow files themselves for security problems (template
# injection, over-broad permissions, unpinned actions, credential
# persistence). The job is a few seconds, so unlike verify it also re-runs
# on every push to a PR that touches workflows.

on:
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch: {}

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: python -m pip install "zizmor==1.30.1"

      - name: Lint workflows
        run: zizmor --format=plain .github/workflows
