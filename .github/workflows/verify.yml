name: verify

on:
  # Only run automatically when a PR is first opened, not on every
  # subsequent push (default pull_request types also include
  # synchronize/reopened). To check a later commit, trigger manually
  # against that branch's current head:
  #   gh workflow run verify.yml --ref <branch-name>
  pull_request:
    types: [opened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
            otelmonty/go.sum
            cmd/shmonty/go.sum

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          cargo fmt --all --check

      - name: Build native shared library
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          MONTY_GO_FFI_SKIP_HEADER=1 scripts/build-go-ffi.sh x86_64-unknown-linux-gnu

      - name: Run Rust tests
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo test -p monty-go-ffi --locked

      - name: Run CGO-disabled tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      # FuzzLoadRunner feeds arbitrary bytes to LoadRunner, the code most
      # exposed to upstream serialization changes. Short pass only; run longer
      # locally (see docs/contributing.md).
      - name: Fuzz LoadRunner briefly
        env:
          CGO_ENABLED: "0"
        run: go test -run '^$' -fuzz FuzzLoadRunner -fuzztime=30s .

      - name: Smoke test example module
        shell: bash
        run: |
          cd examples
          CGO_ENABLED=0 go run ./cmd/example

      - name: Test otelmonty submodule
        shell: bash
        run: |
          cd otelmonty
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go build ./cmd/example

      - name: Test shmonty module
        shell: bash
        run: |
          cd cmd/shmonty
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...

  platform-verify:
    name: verify ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            run_go_tests: true
            build_only_note: ""
          - name: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            run_go_tests: true
            build_only_note: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Build native shared library
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          MONTY_GO_FFI_SKIP_HEADER=1 scripts/build-go-ffi.sh "${{ matrix.rust_target }}"

      - name: Run Go tests
        if: matrix.run_go_tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build-only verification note
        if: ${{ !matrix.run_go_tests }}
        run: echo "${{ matrix.build_only_note }}"

  verify-musl-amd64:
    name: verify linux-musl-amd64
    runs-on: ubuntu-latest
    # Off by default: gomonty's only known consumer (sparktea) doesn't
    # target musl/Alpine, and this build-only check (no Go tests) adds
    # several minutes to every PR. Enable temporarily with:
    #   gh variable set RUN_MUSL_CI --body true --repo mdfranz/gomonty
    if: vars.RUN_MUSL_CI == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: musl-amd64
          cache-on-failure: true

      - name: Build native shared library in musl container
        shell: bash
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /work \
            rust:1.96-alpine3.21 \
            sh -c '
              set -eux
              apk add --no-cache bash build-base python3
              host="$(rustc -vV | sed -n "s/^host: //p")"
              test "$host" = "x86_64-unknown-linux-musl"
              export PYO3_PYTHON="$(command -v python3)"
              export MONTY_GO_FFI_MUSL_NATIVE=1
              MONTY_GO_FFI_SKIP_HEADER=1 bash scripts/build-go-ffi.sh x86_64-unknown-linux-musl
              chmod -R a+rwX /usr/local/cargo/registry /usr/local/cargo/git
            '

      - name: Build-only verification note
        run: echo "Musl/Alpine shared libraries are build-verified in a musl-native container; native Go tests are not run on this workflow."

  verify-musl-arm64:
    name: verify linux-musl-arm64
    runs-on: ubuntu-24.04-arm
    # See verify-musl-amd64's comment: off by default, same toggle.
    if: vars.RUN_MUSL_CI == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: musl-arm64
          cache-on-failure: true

      - name: Build native shared library in musl container
        shell: bash
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /work \
            rust:1.96-alpine3.21 \
            sh -c '
              set -eux
              apk add --no-cache bash build-base python3
              host="$(rustc -vV | sed -n "s/^host: //p")"
              test "$host" = "aarch64-unknown-linux-musl"
              export PYO3_PYTHON="$(command -v python3)"
              export MONTY_GO_FFI_MUSL_NATIVE=1
              MONTY_GO_FFI_SKIP_HEADER=1 bash scripts/build-go-ffi.sh aarch64-unknown-linux-musl
              chmod -R a+rwX /usr/local/cargo/registry /usr/local/cargo/git
            '

      - name: Build-only verification note
        run: echo "Musl/Alpine shared libraries are build-verified in a musl-native container; native Go tests are not run on this workflow."
