name: verify

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly full-platform run (Mondays 06:00 UTC) runs with the production
    # release profile so Windows, macOS, and musl stay tested with LTO enabled.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

env:
  MONTY_GO_FFI_PROFILE: ${{ github.event_name == 'schedule' && 'release' || 'ci' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      proto: ${{ steps.classify.outputs.proto }}
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "code=true"
              echo "proto=true"
              echo "native=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || git fetch --no-tags origin
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA" || git fetch --no-tags origin
          fi
          changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "Changed files in ${BASE_SHA}...${HEAD_SHA}:"
          echo "$changed"
          printf '%s\n' "$changed" | bash scripts/ci-classify-changes.sh | tee -a "$GITHUB_OUTPUT"

  # The full linux-amd64 (x86-64) check: builds the native library for
  # x86_64-unknown-linux-gnu and runs formatting, the Rust tests, the Go tests,
  # vet, a short fuzz and the example/submodule tests. The job id stays
  # `go-pure`; the name below is what shows up in the checks list.
  go-pure:
    name: verify linux-amd64
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum
            otelmonty/go.sum
            cmd/shmonty/go.sum
            remote/go.sum

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.98.0"
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: ${{ env.MONTY_GO_FFI_PROFILE }}
          cache-on-failure: true

      - name: Check formatting and toolchain pin
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          cargo fmt --all --check
          toolchain_channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          toolchain_major_minor="${toolchain_channel%.*}"
          test -n "$toolchain_major_minor"
          for wf in .github/workflows/verify.yml .github/workflows/release-prep.yml; do
            for img in $(grep -oE 'rust:[0-9]+\.[0-9]+-alpine' "$wf" | sort -u); do
              if [ "$img" != "rust:${toolchain_major_minor}-alpine" ]; then
                echo "$wf uses $img, expected rust:${toolchain_major_minor}-alpine from rust-toolchain.toml" >&2
                exit 1
              fi
            done
            for tc in $(sed -n 's/^[[:space:]]*toolchain:[[:space:]]*"\(.*\)"/\1/p' "$wf"); do
              if [ "$tc" != "$toolchain_channel" ]; then
                echo "$wf sets dtolnay/rust-toolchain toolchain=$tc, expected $toolchain_channel" >&2
                exit 1
              fi
            done
          done

      - name: Build native shared library
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          MONTY_GO_FFI_SKIP_HEADER=1 scripts/build-go-ffi.sh x86_64-unknown-linux-gnu

      - name: Run shmonty Python examples
        run: env -u OTEL_EXPORTER_OTLP_ENDPOINT make shmonty-examples

      - name: Run Rust tests
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo test -p monty-go-ffi --locked --profile "$MONTY_GO_FFI_PROFILE" --target x86_64-unknown-linux-gnu

      - name: Run clippy
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo clippy -p monty-go-ffi --tests --locked --profile "$MONTY_GO_FFI_PROFILE" --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Run CGO-disabled tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      # FuzzLoadRunner feeds arbitrary bytes to LoadRunner, the code most
      # exposed to upstream serialization changes. Short pass only; run longer
      # locally (see docs/contributing.md).
      - name: Fuzz LoadRunner briefly
        env:
          CGO_ENABLED: "0"
        run: go test -run '^$' -fuzz FuzzLoadRunner -fuzztime=30s .

      - name: Test and smoke-run example module
        shell: bash
        run: |
          cd examples
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go run ./cmd/example
          CGO_ENABLED=0 go run ./cmd/remote

      - name: Test otelmonty submodule
        shell: bash
        run: |
          cd otelmonty
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go build ./cmd/example

      - name: Test shmonty module
        shell: bash
        run: |
          cd cmd/shmonty
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...

  # The remote module's generated protobuf/gRPC code must match the vendored
  # monty.v1 proto, and the proto pin must match the FFI pin. No native build.
  check-proto:
    name: check generated proto
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: remote/go.sum

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Generated code is up to date
        run: make check-proto

      - name: Test remote module
        run: cd remote && go test ./...

  platform-verify:
    name: verify ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' || vars.RUN_MACOS_CI == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Native-affecting PRs, scheduled runs, and manual dispatches run both
        # linux-arm64 and darwin-arm64 (unless RUN_MACOS_CI == 'false').
        # Main push cache-seeding runs linux-arm64 unless RUN_MACOS_CI == 'true'.
        include: ${{ fromJSON(((github.event_name != 'push' || vars.RUN_MACOS_CI == 'true') && vars.RUN_MACOS_CI != 'false') && '[{"name":"linux-arm64","runner":"ubuntu-24.04-arm","rust_target":"aarch64-unknown-linux-gnu","run_go_tests":true,"build_only_note":""},{"name":"darwin-arm64","runner":"macos-15","rust_target":"aarch64-apple-darwin","run_go_tests":true,"build_only_note":""}]' || '[{"name":"linux-arm64","runner":"ubuntu-24.04-arm","rust_target":"aarch64-unknown-linux-gnu","run_go_tests":true,"build_only_note":""}]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.98.0"
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: ${{ env.MONTY_GO_FFI_PROFILE }}
          cache-on-failure: true

      - name: Build native shared library
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          MONTY_GO_FFI_SKIP_HEADER=1 scripts/build-go-ffi.sh "$RUST_TARGET"

      - name: Run Go tests
        if: matrix.run_go_tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build-only verification note
        if: ${{ !matrix.run_go_tests }}
        env:
          BUILD_ONLY_NOTE: ${{ matrix.build_only_note }}
        shell: bash
        run: echo "$BUILD_ONLY_NOTE"

  verify-windows-amd64:
    name: verify windows-amd64
    runs-on: windows-latest
    # Off by default on PRs to keep routine PR costs low; always runs on weekly
    # schedule and manual dispatch, or when enabled with RUN_WINDOWS_CI=true.
    if: vars.RUN_WINDOWS_CI == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.98.0"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: ${{ env.MONTY_GO_FFI_PROFILE }}
          cache-on-failure: true

      - name: Build native shared library
        shell: bash
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          MONTY_GO_FFI_SKIP_HEADER=1 scripts/build-go-ffi.sh x86_64-pc-windows-msvc

      - name: Run Windows smoke test
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: go test -v -run '^TestPlatformSmoke$' .

  verify-musl-amd64:
    name: verify linux-musl-amd64
    runs-on: ubuntu-latest
    # Off by default on PRs: adds several minutes to every PR. Always runs on
    # weekly schedule and manual dispatch, or when enabled with RUN_MUSL_CI=true.
    if: vars.RUN_MUSL_CI == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: musl-amd64-${{ env.MONTY_GO_FFI_PROFILE }}
          cache-on-failure: true

      - name: Build native shared library in musl container
        shell: bash
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git
          docker run --rm \
            -e MONTY_GO_FFI_PROFILE \
            -v "$PWD:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /work \
            rust:1.98-alpine \
            sh -c '
              set -eux
              apk add --no-cache bash build-base python3
              host="$(rustc -vV | sed -n "s/^host: //p")"
              test "$host" = "x86_64-unknown-linux-musl"
              export PYO3_PYTHON="$(command -v python3)"
              export MONTY_GO_FFI_MUSL_NATIVE=1
              MONTY_GO_FFI_SKIP_HEADER=1 bash scripts/build-go-ffi.sh x86_64-unknown-linux-musl
              chmod -R a+rwX /usr/local/cargo/registry /usr/local/cargo/git
            '

      - name: Run musl smoke test in container
        shell: bash
        run: |
          trap 'rm -f .musl-smoke.test' EXIT
          CGO_ENABLED=0 go test -c -tags musl -ldflags "-I /lib/ld-musl-x86_64.so.1" -o .musl-smoke.test .
          docker run --rm -v "$PWD:/work" -w /work rust:1.98-alpine /work/.musl-smoke.test -test.v -test.run '^TestPlatformSmoke$'

  verify-musl-arm64:
    name: verify linux-musl-arm64
    runs-on: ubuntu-24.04-arm
    # See verify-musl-amd64's comment: off by default on PRs, runs on schedule/dispatch.
    if: vars.RUN_MUSL_CI == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: musl-arm64-${{ env.MONTY_GO_FFI_PROFILE }}
          cache-on-failure: true

      - name: Build native shared library in musl container
        shell: bash
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git
          docker run --rm \
            -e MONTY_GO_FFI_PROFILE \
            -v "$PWD:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /work \
            rust:1.98-alpine \
            sh -c '
              set -eux
              apk add --no-cache bash build-base python3
              host="$(rustc -vV | sed -n "s/^host: //p")"
              test "$host" = "aarch64-unknown-linux-musl"
              export PYO3_PYTHON="$(command -v python3)"
              export MONTY_GO_FFI_MUSL_NATIVE=1
              MONTY_GO_FFI_SKIP_HEADER=1 bash scripts/build-go-ffi.sh aarch64-unknown-linux-musl
              chmod -R a+rwX /usr/local/cargo/registry /usr/local/cargo/git
            '

      - name: Run musl smoke test in container
        shell: bash
        run: |
          trap 'rm -f .musl-smoke.test' EXIT
          CGO_ENABLED=0 go test -c -tags musl -ldflags "-I /lib/ld-musl-aarch64.so.1" -o .musl-smoke.test .
          docker run --rm -v "$PWD:/work" -w /work rust:1.98-alpine /work/.musl-smoke.test -test.v -test.run '^TestPlatformSmoke$'

  verify:
    name: verify
    runs-on: ubuntu-latest
    needs:
      - changes
      - go-pure
      - check-proto
      - platform-verify
      - verify-windows-amd64
      - verify-musl-amd64
      - verify-musl-arm64
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Verify selected jobs succeeded
        env:
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_GO_PURE: ${{ needs.go-pure.result }}
          RESULT_CHECK_PROTO: ${{ needs.check-proto.result }}
          RESULT_PLATFORM_VERIFY: ${{ needs.platform-verify.result }}
          RESULT_WINDOWS_AMD64: ${{ needs.verify-windows-amd64.result }}
          RESULT_MUSL_AMD64: ${{ needs.verify-musl-amd64.result }}
          RESULT_MUSL_ARM64: ${{ needs.verify-musl-arm64.result }}
        shell: bash
        run: |
          if [ "$RESULT_CHANGES" != "success" ]; then
            echo "changes job did not succeed: $RESULT_CHANGES" >&2
            exit 1
          fi
          for pair in \
            "go-pure:$RESULT_GO_PURE" \
            "check-proto:$RESULT_CHECK_PROTO" \
            "platform-verify:$RESULT_PLATFORM_VERIFY" \
            "verify-windows-amd64:$RESULT_WINDOWS_AMD64" \
            "verify-musl-amd64:$RESULT_MUSL_AMD64" \
            "verify-musl-arm64:$RESULT_MUSL_ARM64"
          do
            job="${pair%%:*}"
            res="${pair#*:}"
            echo "$job: $res"
            case "$res" in
              success|skipped) ;;
              *)
                echo "$job failed with result: $res" >&2
                exit 1
                ;;
            esac
          done

  report-scheduled-failure:
    name: report scheduled failure
    runs-on: ubuntu-latest
    needs:
      - verify
    if: ${{ always() && github.event_name == 'schedule' && needs.verify.result == 'failure' }}
    permissions:
      issues: write
    steps:
      - name: Open or update scheduled failure issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "CI: scheduled full-platform verify failed";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `A scheduled \`${context.workflow}\` run failed: ${runUrl}`,
              "",
              "Check the run logs for details across Linux (amd64/arm64), macOS, Windows, and musl.",
            ].join("\n");

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "ci",
              per_page: 100,
            });

            const existing = openIssues.data.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["ci"],
            });
            core.info(`Created issue #${created.data.number}`);
