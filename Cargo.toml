[workspace]
resolver = "2"
members = ["crates/monty-go-ffi"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98"
license = "MIT"
authors = ["Eric Hauser","Matthew Franz"]
categories = ["compilers", "emulators", "development-tools"]
keywords = ["python", "interpreter", "sandbox", "embedded", "go"]
homepage = "https://github.com/mdfranz/gomonty"
repository = "https://github.com/mdfranz/gomonty"
documentation = "https://github.com/mdfranz/gomonty"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
# Upstream Monty pin. Keep both rev values aligned when bumping.
monty = { git = "https://github.com/pydantic/monty.git", rev = "3f89dcbf82071896efb5e3ded507db4191e8d829" }
monty_type_checking = { git = "https://github.com/pydantic/monty.git", package = "monty-type-checking", rev = "3f89dcbf82071896efb5e3ded507db4191e8d829" }
monty_types = { git = "https://github.com/pydantic/monty.git", package = "monty-types", rev = "3f89dcbf82071896efb5e3ded507db4191e8d829" }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
rmp-serde = "1.3"
minicbor-serde = { version = "0.7", default-features = false, features = ["alloc"] }
num-bigint = { version = "0.4", features = ["serde"] }
pretty_assertions = "1.4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[workspace.lints.rustdoc]
invalid_codeblock_attributes = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
use_self = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
